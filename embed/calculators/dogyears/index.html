<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: credit this content to the parent page, not the iframe URL -->
  <link rel="canonical" href="https://thelongevityinitiative.org/calculators/dogyears/">

  <!-- Encourage browsers to send Referer header when embedded externally -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Future-proof light/dark mode support -->
  <meta name="color-scheme" content="light">

  <title>Dog age calculator — The Longevity Initiative</title>

  <link rel="stylesheet" href="../../shared/embed.css">
  <link rel="stylesheet" href="dogyears.css">
  <script src="../../shared/card-kit.js"></script>
  <script src="share-card.js"></script>
  <script src="dogyears.js"></script>
</head>
<body>
  <h1 id="pageTitle">Dog age calculator</h1>

  <p id="pageIntro">Convert your dog's age to human-equivalent years using an epigenetic formula based on DNA methylation patterns.</p>

  <div id="dogYearsForm" class="bioageform">
    <noscript>This calculator requires JavaScript to run.</noscript>
  </div>

  <div id="dogYearsResult"></div>

  <div id="shareSection">
    <h2 id="shareHeading">Share your result</h2>

    <div id="toneRow" class="tone-row">
      <span id="toneLabel" class="tone-label"></span>
      <div id="toneSwatches" class="tone-swatches"></div>
    </div>

    <div id="shareCardWrap" class="share-card-wrap">
      <div id="shareCardContainer"></div>
      <div id="dogPhotoCircle" class="dog-photo-overlay" tabindex="0" role="button">
        <span class="photo-add-hint"><span id="photoAddHintText"></span></span>
        <span class="photo-drag-hint"><span id="photoDragHintText"></span></span>
      </div>
      <input type="file" id="dogPhotoInput" accept="image/*" hidden>
      <button type="button" id="photoRemoveBtn" class="photo-remove-overlay" hidden>&times;</button>
      <input type="text" id="dogNameInput" class="dog-name-overlay" maxlength="40" autocomplete="off">
    </div>

    <div class="share-buttons">
      <button id="downloadImageBtn" onclick="downloadShareCard()"></button>
      <button id="nativeShareBtn" onclick="nativeShare()" style="display: none;"></button>
    </div>
    <script>
      if (navigator.share && navigator.canShare) {
        document.getElementById('nativeShareBtn').style.display = '';
      }
    </script>
  </div>

  <div id="aboutSection">
    <h2 id="aboutHeading">About</h2>
    <p id="aboutFormula"></p>
    <p id="aboutLimitations"></p>
    <p id="aboutCitation"></p>
  </div>

  <p class="embed-link">Find out more at <a href="https://thelongevityinitiative.org/calculators/dogyears/">The Longevity Initiative</a>.</p>

  <!-- Embed support: theme, height resize, config -->
  <script>
    (function() {
      // Read embed config from URL params
      window.embedConfig = Object.fromEntries
        ? Object.fromEntries(new URLSearchParams(window.location.search))
        : {};

      // Apply theme: default is light (LI brand), ?theme=dark or ?theme=auto
      var theme = window.embedConfig.theme || 'light';
      if (theme === 'dark' || theme === 'auto') {
        document.documentElement.classList.add('theme-' + theme);
      }
      // Update color-scheme meta for native form controls
      var colorScheme = document.querySelector('meta[name="color-scheme"]');
      if (colorScheme) {
        if (theme === 'dark') colorScheme.content = 'dark';
        else if (theme === 'auto') colorScheme.content = 'light dark';
        else colorScheme.content = 'light';
      }

      // Hide embed link on own site (when ?source=li)
      if (window.embedConfig.source === 'li') {
        document.addEventListener('DOMContentLoaded', function() {
          var link = document.querySelector('.embed-link');
          if (link) link.style.display = 'none';
        });
      }

      // Notify parent iframe of height changes
      // Measure body.scrollHeight (the content), NOT documentElement.scrollHeight:
      // the root element's scrollHeight is clamped to at least the viewport (iframe)
      // height, so reporting it creates a feedback loop — the parent grows the iframe,
      // the viewport grows, the reported height grows, and the iframe expands forever.
      // body height is auto = content height, independent of the viewport.
      function notifyParentOfHeight() {
        window.parent.postMessage(
          { type: 'li-calculator-resize', height: document.body.scrollHeight },
          '*'
        );
      }
      if (window.ResizeObserver) {
        // Observe the content (body), not the viewport (documentElement), so a
        // parent-driven iframe resize doesn't re-trigger a report.
        new ResizeObserver(notifyParentOfHeight).observe(document.body);
      }
      // Answer the host page's handshake (see embed/shared/setup.js): re-report
      // our height on request, so an async setup script that missed our first
      // report can still size the iframe.
      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'li-embed-hello') notifyParentOfHeight();
      });
      window.addEventListener('resize', notifyParentOfHeight);
      document.addEventListener('DOMContentLoaded', notifyParentOfHeight);
    })();
  </script>
</body>
</html>
